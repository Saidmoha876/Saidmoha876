spring.application.name=sorveteria

# Banco H2 em memoria
spring.datasource.url=jdbc:h2:mem:sorveteria
spring.datasource.username=sa
spring.datasource.password=

# O Hibernate cria a tabela "produtos" a partir da entidade Produto
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Console do banco: http://localhost:8080/h2-console (JDBC URL: jdbc:h2:mem:sorveteria)
spring.h2.console.enabled=true

# Mostra a mensagem de erro no corpo da resposta (ex.: "Produto nao encontrado com id 2")
spring.web.error.include-message=always
