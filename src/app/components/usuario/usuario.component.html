<div class="container">
    <div class="row topo">
        <div class="col-lg-4"></div>
        <div class="col-lg-4">
            <div class="card centralizar">
                <div class="card-body">
                    <h5 class="card-title mb-3">Cadastro de usuário</h5>

                    <mdb-form-control>
                        <input mdbInput type="text" id="nome" class="form-control mb-3" [(ngModel)]='usuario.nome'/>
                        <label mdbLabel class="form-label" for="nome">Nome</label>
                    </mdb-form-control>

                    <mdb-form-control>
                        <input mdbInput type="text" id="usuario" class="form-control mb-3" [(ngModel)]='usuario.usuario'/>
                        <label mdbLabel class="form-label" for="usuario">Usuário</label>
                    </mdb-form-control>

                    <mdb-form-control>
                        <input mdbInput type="password" id="senha" class="form-control mb-3" [(ngModel)]='usuario.senha'/>
                        <label mdbLabel class="form-label" for="senha">Senha</label>
                    </mdb-form-control>

                    <mdb-form-control>
                        <input mdbInput type="password" id="confirmarSenha" class="form-control mb-3" [(ngModel)]='confirmarSenha'/>
                        <label mdbLabel class="form-label" for="confirmarSenha">Confirmar senha</label>
                    </mdb-form-control>

                    <button type="button" class="btn btn-primary" (click)="salvar()">Cadastrar</button>
                </div>
            </div>
        </div>
        <div class="col-lg-4"></div>
    </div>
</div>
